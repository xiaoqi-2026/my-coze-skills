<html lang="zh-CN" data-immersive-translate-page-theme="light"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>讲透社 · 输出驱动学习小组助手</title>
<style>
:root{
  --canvas:#f6f5f1;
  --surface:#ffffff;
  --ink:#1a1a18;
  --ink-2:#5c5c56;
  --ink-3:#8e8e86;
  --line:#e4e1d8;
  --line-2:#d2cec2;
  --accent:#1f4d3f;
  --accent-ink:#ffffff;
  --accent-soft:#e9f0ec;
  --danger:#a8392b;
  --ok:#1f7a4d;
  --warn:#a8730f;
  --radius:12px;
  --radius-sm:8px;
  --s1:6px; --s2:10px; --s3:16px; --s4:24px; --s5:36px; --s6:56px;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--canvas);
  color:var(--ink);
  font-family:var(--font);
  font-size:16px;
  line-height:1.65;
  overflow-x:hidden;
}
h1,h2,h3{margin:0;line-height:1.3;font-weight:650;letter-spacing:-0.01em}
h1{font-size:clamp(22px,3.2vw,28px)}
h2{font-size:clamp(16px,2.2vw,18px);color:var(--ink)}
.view-title{font-size:clamp(22px,3.2vw,28px);color:var(--ink);letter-spacing:-0.01em}
p{margin:0}
button{font-family:inherit;font-size:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.94);
  backdrop-filter:saturate(1.4) blur(8px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1120px;margin:0 auto;
  padding:10px clamp(16px,4vw,32px);
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:30px;height:30px;flex:none;border-radius:8px;
  background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;
}
.brand-text{font-weight:650;font-size:16px;display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-text small{font-weight:400;font-size:11px;color:var(--ink-3);letter-spacing:.02em}
.tabs{display:flex;gap:2px;background:var(--canvas);padding:3px;border-radius:9px;border:1px solid var(--line)}
.tab{
  border:0;background:transparent;color:var(--ink-2);
  padding:6px 14px;border-radius:6px;cursor:pointer;
  font-size:14px;transition:background .16s ease,color .16s ease;
}
.tab:hover{color:var(--ink)}
.tab.is-active{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- layout ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:var(--s4) clamp(16px,4vw,32px) 96px}
.view{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  padding:9px 16px;border-radius:var(--radius-sm);cursor:pointer;
  font-size:15px;line-height:1.4;transition:background .16s ease,border-color .16s ease,color .16s ease;
}
.btn:hover{border-color:var(--ink-3)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn-primary:hover{background:#183c31;border-color:#183c31}
.btn-ghost{background:transparent}
.btn-sm{padding:6px 12px;font-size:13.5px}
.btn-lg{padding:14px 26px;font-size:16.5px}
.btn-danger{color:var(--danger);border-color:#e0c9c4}
.btn-danger:hover{border-color:var(--danger)}
.btn-row{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
.hint{color:var(--ink-3);font-size:13.5px;line-height:1.6}

/* ---------- home ---------- */
.group-head{
  display:flex;align-items:flex-end;gap:var(--s3);flex-wrap:wrap;
  padding-bottom:var(--s3);border-bottom:1px solid var(--line);
}
.group-head h1{flex:none}
.group-sub{color:var(--ink-2);font-size:14px;flex:1;min-width:180px}
.start-row{
  margin:var(--s4) 0 var(--s5);
  display:flex;flex-direction:column;align-items:flex-start;gap:var(--s2);
  padding:var(--s4);border-radius:var(--radius);
  background:var(--accent-soft);border:1px solid #d5e3db;
}
.start-row .hint{color:#4a6b5e}

.stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;margin-bottom:var(--s5);
}
.stat{background:var(--surface);padding:var(--s3) var(--s3)}
.stat b{display:block;font-size:26px;font-weight:680;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;color:var(--accent)}
.stat span{font-size:12.5px;color:var(--ink-3)}

.recent{margin-bottom:var(--s5)}
.recent h2{margin-bottom:var(--s3)}
.rec-item{
  display:flex;align-items:baseline;gap:var(--s3);
  padding:var(--s3) 0;border-bottom:1px solid var(--line);
  cursor:pointer;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0;
}
.rec-item:hover .rec-title{color:var(--accent)}
.rec-title{font-weight:600;font-size:15.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .16s}
.rec-meta{font-size:12.5px;color:var(--ink-3);flex:none;font-variant-numeric:tabular-nums}
.rec-empty{padding:var(--s4) 0;color:var(--ink-3);font-size:14px}

.pending{
  margin-top:var(--s4);padding:var(--s3) var(--s4);
  background:#fff8e8;border:1px solid #ecd9ae;border-radius:var(--radius);
  display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
}
.pending p{flex:1;min-width:200px;font-size:14.5px;color:#6b4f13}

.data-zone{padding-top:var(--s4);border-top:1px solid var(--line)}
.data-zone h2{margin-bottom:var(--s2)}

/* ---------- session ---------- */
.session-head{
  position:sticky;top:53px;z-index:10;
  background:var(--canvas);
  padding:var(--s2) 0 var(--s3);
  display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
  border-bottom:1px solid var(--line);
}
.steps{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.step-chip{
  font-size:12.5px;padding:4px 10px;border-radius:20px;
  border:1px solid var(--line-2);color:var(--ink-3);background:var(--surface);
  display:flex;align-items:center;gap:5px;
}
.step-chip i{font-style:normal;font-family:var(--mono);font-size:11px;opacity:.7}
.step-chip.is-done{color:var(--ok);border-color:#bfd9cb;background:#f2f8f4}
.step-chip.is-active{color:var(--accent-ink);background:var(--accent);border-color:var(--accent);font-weight:600}

.thread{
  max-width:760px;margin:0 auto;
  padding:var(--s4) 0 var(--s5);
  display:flex;flex-direction:column;gap:var(--s3);
}
.msg{display:flex;gap:var(--s2);align-items:flex-start}
.msg.me{justify-content:flex-end}
.msg.probe{padding-left:34px;position:relative}
.msg.probe .depth{
  position:absolute;left:0;top:0;
  width:24px;height:24px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);
  font-size:11.5px;font-family:var(--mono);
  display:flex;align-items:center;justify-content:center;
}
.bubble{
  padding:12px 15px;border-radius:12px;
  font-size:15px;line-height:1.72;
  white-space:pre-wrap;overflow-wrap:anywhere;
  max-width:100%;
}
.msg.sys .bubble{background:var(--surface);border:1px solid var(--line);border-top-left-radius:4px}
.msg.me .bubble{background:var(--accent);color:var(--accent-ink);border-top-right-radius:4px;max-width:86%}
.msg.note .bubble{background:var(--accent-soft);border:1px dashed #c3d5cb;color:#31513f;font-size:14px;border-top-left-radius:4px}
.msg.warn .bubble{background:#fff8e8;border:1px dashed #e5cf9f;color:#6b4f13;font-size:14px;border-top-left-radius:4px}
.tag-label{
  display:block;font-size:11px;letter-spacing:.06em;
  color:var(--ink-3);margin-bottom:4px;text-transform:uppercase;font-weight:600;
}
.check-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.check-list li{display:flex;gap:8px;font-size:13.5px;line-height:1.55}
.check-list li::before{content:"○";flex:none;color:var(--ink-3);font-family:var(--mono)}
.check-list li.ok::before{content:"●";color:var(--ok)}
.check-list li.no{color:var(--warn)}
.check-list li.no::before{content:"●";color:var(--warn)}

.composer{
  position:sticky;bottom:0;z-index:10;
  max-width:760px;margin:0 auto;
  background:var(--canvas);
  padding:var(--s3) 0 var(--s4);
  border-top:1px solid var(--line);
}
.composer textarea{
  width:100%;padding:12px 14px;
  border:1px solid var(--line-2);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--ink);
  font-family:inherit;font-size:15px;line-height:1.65;
  resize:vertical;min-height:84px;
}
.composer textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.composer-actions{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-top:var(--s2)}
.composer-actions .hint{font-size:12px}

.inline-form{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:var(--s4);
  display:flex;flex-direction:column;gap:var(--s3);
}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.field input,.field textarea{
  width:100%;padding:10px 12px;
  border:1px solid var(--line-2);border-radius:var(--radius-sm);
  font-family:inherit;font-size:15px;line-height:1.6;
  background:var(--surface);color:var(--ink);resize:vertical;
}
.field input:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.field .hint{font-size:12.5px}
.range-row{display:flex;align-items:center;gap:var(--s3)}
.range-row input[type=range]{flex:1;accent-color:var(--accent)}
.range-val{font-family:var(--mono);font-size:15px;width:2.2em;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- cards ---------- */
.card-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));
  gap:var(--s3);margin-top:var(--s4);
}
.tcard{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:var(--s4);
  display:flex;flex-direction:column;gap:var(--s3);
  min-width:0;
}
.tcard-core{
  font-size:17px;font-weight:650;line-height:1.5;color:var(--accent);
  padding-bottom:var(--s3);border-bottom:1px solid var(--line);
}
.tcard-story{font-size:14px;line-height:1.75;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.tcard-hook{
  font-size:13.5px;color:var(--ink-2);padding-top:var(--s3);
  border-top:1px dashed var(--line-2);
}
.tcard-hook::before{content:"反问 ";color:var(--ink-3);font-size:11.5px;letter-spacing:.06em}
.tcard-foot{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);font-size:12px;color:var(--ink-3)}
.empty-state{
  padding:var(--s6) var(--s4);text-align:center;
  color:var(--ink-3);font-size:14.5px;line-height:1.8;
}

/* ---------- records ---------- */
.record{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:var(--s4);margin-top:var(--s3);
}
.record-head{display:flex;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;align-items:baseline}
.record-head h3{font-size:16px;flex:1;min-width:160px}
.record-head time{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.record-q{color:var(--ink-2);font-size:14.5px;margin-top:var(--s2)}
.record details{margin-top:var(--s3)}
.record summary{cursor:pointer;font-size:13.5px;color:var(--accent);font-weight:600}
.record .detail-body{margin-top:var(--s3);display:flex;flex-direction:column;gap:var(--s3);font-size:14px;line-height:1.75}
.record .detail-body h4{margin:0;font-size:13px;color:var(--ink-3);font-weight:600;letter-spacing:.04em}
.record .detail-body blockquote{
  margin:0;padding-left:var(--s3);border-left:2px solid var(--line-2);
  color:var(--ink-2);font-size:13.5px;
}
.record .detail-body .ans{white-space:pre-wrap;overflow-wrap:anywhere}

/* ---------- dialog ---------- */
dialog{
  border:1px solid var(--line-2);border-radius:var(--radius);
  padding:var(--s4);max-width:440px;width:calc(100% - 32px);
  background:var(--surface);color:var(--ink);
}
dialog::backdrop{background:rgba(20,24,22,.42)}
dialog h2{margin-bottom:var(--s3)}
dialog .field{margin-bottom:var(--s3)}
.dialog-actions{display:flex;gap:var(--s2);justify-content:flex-end}

/* ---------- print ---------- */
@media print{
  body{background:#fff;font-size:12pt}
  .topbar,.composer,.session-head .btn,.btn,.tabs,.data-zone,.start-row{display:none!important}
  .wrap{padding:0;max-width:none}
  .thread{max-width:none;padding:0}
  .msg.me .bubble{background:#f0f0ee;color:#000;border:1px solid #ccc}
  .msg.sys .bubble,.msg.note .bubble,.msg.warn .bubble{border:1px solid #ccc}
  .tcard,.record{break-inside:avoid;border:1px solid #999}
  a{color:#000;text-decoration:underline}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">讲</span>
      <span class="brand-text">讲透社<small>输出驱动学习小组</small></span>
    </div>
    <nav class="tabs" aria-label="主导航">
      <button class="tab is-active" data-view="home" type="button">小组</button>
      <button class="tab" data-view="cards" type="button">话术卡</button>
      <button class="tab" data-view="records" type="button">记录</button>
    </nav>
  </div>
</header>

<main class="wrap">

  <!-- ============ 首页 ============ -->
  <section id="view-home" class="view">
    <div class="group-head">
      <h1 id="groupName">讲透社</h1>
      <p class="group-sub" id="groupSub">成员 1 人：我</p>
      <button class="btn btn-ghost btn-sm" id="editGroupBtn" type="button">编辑小组</button>
    </div>

    <div id="pendingBox"></div>

    <div class="start-row">
      <button class="btn btn-primary btn-lg" id="startBtn" type="button">发起一次学习会话</button>
      <p class="hint">带一个真实问题来，二十分钟，带走一张能讲出去的话术卡。</p>
    </div>

    <section aria-label="学习轨迹">
      <div class="stats">
        <div class="stat"><b id="statSessions">0</b><span>完成会话</span></div>
        <div class="stat"><b id="statCards">0</b><span>话术卡</span></div>
        <div class="stat"><b id="statStreak">0</b><span>连续天数</span></div>
        <div class="stat"><b id="statAvg">—</b><span>平均自评</span></div>
      </div>
    </section>

    <section class="recent">
      <h2>最近的会话</h2>
      <div id="recentList"><p class="rec-empty">还没有会话。点上面的按钮，带一个真实问题来试试。</p></div>
    </section>

    <section class="data-zone">
      <h2>数据</h2>
      <p class="hint">所有内容只存在这台设备的浏览器里，不上传任何地方。换设备前记得先导出备份。</p>
      <div class="btn-row">
        <button class="btn btn-ghost btn-sm" id="exportAllBtn" type="button">导出全部数据（JSON）</button>
        <button class="btn btn-ghost btn-sm" id="importAllBtn" type="button">导入备份</button>
        <button class="btn btn-ghost btn-sm btn-danger" id="clearAllBtn" type="button">清空所有数据</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden="">
    </section>
  </section>

  <!-- ============ 会话 ============ -->
  <section id="view-session" class="view" hidden="">
    <div class="session-head">
      <button class="btn btn-ghost btn-sm" id="backBtn" type="button">返回</button>
      <div class="steps" id="steps"></div>
    </div>
    <div class="thread" id="thread"></div>
    <div class="composer" id="composer">
      <label class="sr-only" for="answerInput">你的回答</label>
      <textarea id="answerInput" rows="3"></textarea>
      <div class="composer-actions">
        <span class="hint" id="composerHint">Enter 提交，Shift + Enter 换行</span>
        <button class="btn btn-primary" id="submitBtn" type="button">提交</button>
      </div>
    </div>
  </section>

  <!-- ============ 话术卡 ============ -->
  <section id="view-cards" class="view" hidden="">
    <h2 class="view-title">话术卡库</h2>
    <p class="hint" style="margin-top:8px">每张卡 = 一句话核心 + 一个故事 + 一个反问钩子。攒够了，就是你自己的素材库。</p>
    <div id="cardGrid" class="card-grid"></div>
  </section>

  <!-- ============ 记录 ============ -->
  <section id="view-records" class="view" hidden="">
    <h2 class="view-title">会话记录</h2>
    <div class="btn-row">
      <button class="btn btn-ghost btn-sm" id="exportRecordsBtn" type="button">导出全部记录（Markdown）</button>
    </div>
    <div id="recordList"></div>
  </section>

</main>

<dialog id="groupDialog">
  <h2>编辑小组</h2>
  <div class="field">
    <label for="gNameInput">小组名称</label>
    <input id="gNameInput" type="text" maxlength="20">
  </div>
  <div class="field">
    <label for="gMembersInput">成员（用顿号或逗号分隔）</label>
    <textarea id="gMembersInput" rows="2" placeholder="我、小林、老周"></textarea>
    <span class="hint">成员只用在本机记录里，不会同步给任何人。</span>
  </div>
  <div class="dialog-actions">
    <button class="btn btn-ghost btn-sm" id="groupCancel" type="button">取消</button>
    <button class="btn btn-primary btn-sm" id="groupSave" type="button">保存</button>
  </div>
</dialog>

<script>
(function(){
  'use strict';
  try{

  /* =========================================================
     数据层
     ========================================================= */
  var STORE_KEY = 'jiangtou_club_v1';

  function defaultDB(){
    return {
      version: 1,
      group: { name: '讲透社', members: ['我'] },
      sessions: [],
      cards: []
    };
  }

  function loadDB(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return defaultDB();
      var d = JSON.parse(raw);
      if(!d || typeof d !== 'object') return defaultDB();
      if(!d.group || typeof d.group !== 'object') d.group = defaultDB().group;
      if(!Array.isArray(d.group.members) || !d.group.members.length) d.group.members = ['我'];
      if(!Array.isArray(d.sessions)) d.sessions = [];
      if(!Array.isArray(d.cards)) d.cards = [];
      return d;
    }catch(e){
      return defaultDB();
    }
  }

  function saveDB(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(db)); }catch(e){ /* 静默降级 */ }
  }

  var db = loadDB();
  var cur = null;        // 当前会话对象（db.sessions 中的引用）
  var curView = 'home';

  /* =========================================================
     工具
     ========================================================= */
  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function pad2(n){ return n < 10 ? '0' + n : '' + n; }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
  }
  function nowLabel(){
    var d = new Date();
    return pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function $(id){ return document.getElementById(id); }

  function download(filename, text, mime){
    try{
      var blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    }catch(e){ /* 静默降级 */ }
  }

  /* =========================================================
     追问规则
     ========================================================= */
  var PROBES = [
    {
      key: '现象',
      ask: '先别急着下结论。这件事最近一次真实发生，是什么时候？谁在场？你当时正在做什么？',
      ok: function(a){
        return a.length >= 15 && /(我|他|她|你|客户|老板|同事|朋友|妈|爸|组员|对方|领导|老师|同学)/.test(a);
      },
      retry: '还是太笼统了。给我一个具体场景——具体到那天你说了什么、对方回了什么。'
    },
    {
      key: '原因',
      ask: '好。那你当时为什么会那样做？如果换成另一个人站在你的位置，他会不会做出不一样的选择？',
      ok: function(a){
        return a.length >= 15 && /(因为|所以|怕|担心|不敢|不想|觉得|以为|害怕|懒得|只好|只能|没有|免得|图)/.test(a);
      },
      retry: '你说的更像是「结果」，不是「原因」。再往前推一步——是什么让你当时只能那样做？'
    },
    {
      key: '本质',
      ask: '把刚才那些细节都去掉，只留一句话：你真正卡住的，是哪一件事？',
      ok: function(a){ return a.length >= 8; },
      retry: '还是太长。试着压到 30 个字以内。压不下去，说明你还没找到那一件。'
    },
    {
      key: '假设',
      ask: '换个角度：假设你刚才的判断是错的——对方其实是对的。你的结论还站得住吗？站不住的地方在哪？',
      ok: function(a){ return a.length >= 15; },
      retry: '这句太安全了，等于什么都没说。挑一个你真的不确定的点出来。'
    },
    {
      key: '行动',
      ask: '最后一层。明天上午，你能做的一件具体的事是什么？要小到一定能做完，具体到别人能看见。',
      ok: function(a){
        return a.length >= 10 && /(明天|今天|后天|周|点|分钟|小时|发|写|问|约|打|改|做|说|查|准备|列|记)/.test(a);
      },
      retry: '这不是行动，是想法。「跟他讲清楚」不算；「明早九点发微信问他那句话到底什么意思」才算。'
    }
  ];

  var STEPS = [
    { key: 'ask',   label: '带问题来' },
    { key: 'explain', label: '讲清它' },
    { key: 'probe', label: '五层追问' },
    { key: 'story', label: '讲成故事' },
    { key: 'card',  label: '沉淀话术卡' }
  ];

  function stepIndexOf(s){
    if(s.step === 'topic' || s.step === 'question') return 0;
    if(s.step === 'explain') return 1;
    if(s.step === 'probe') return 2;
    if(s.step === 'story') return 3;
    if(s.step === 'card' || s.step === 'review') return 4;
    return 4;
  }

  function checkExplain(t){
    var issues = [];
    if(t.length < 40) issues.push('太短了。三句话讲清，至少 40 个字。');
    var vague = (t.match(/(这个|那个|就是|其实|反正|大概|什么的|之类)/g) || []).length;
    if(vague >= 3) issues.push('「这个／那个／就是」这类词出现了 ' + vague + ' 次。把它们换成具体的名字。');
    if(!/(因为|所以|如果|当|一旦|只要|就会)/.test(t) && t.length < 80){
      issues.push('你只说了「是什么」，没说「为什么会这样」。补一句因果。');
    }
    return issues;
  }

  function checkStory(t){
    var checks = [];
    checks.push({
      label: '字数够（150 字以上）',
      pass: t.length >= 150,
      hint: '现在 ' + t.length + ' 字，再展开一点。'
    });
    checks.push({
      label: '有具体的人',
      pass: /(我|他|她|你|客户|老板|同事|朋友|妈|爸|组员|对方|师傅|同学|领导)/.test(t),
      hint: '写清楚是谁，别用「人们」「大家」。'
    });
    checks.push({
      label: '有具体的数字或时间',
      pass: /(\d|[一二三四五六七八九十百千]+(元|块|万|天|年|月|次|点|分钟|小时|岁))/.test(t),
      hint: '加一个具体数字或时间，比如「拖了两年」「三十万」「九点半」。'
    });
    checks.push({
      label: '有转折或冲突',
      pass: /(但是|但|结果|没想到|后来|反而|以为|才发现|错了|麻烦|卡住|争执|吵|不同意|奇怪|居然|竟然|偏偏)/.test(t),
      hint: '故事要有转折——「我以为是……结果是……」。'
    });
    var abs = (t.match(/(应该|必须|一般来说|理论上|总之|综上|首先|其次|所以说|本质上)/g) || []).length;
    checks.push({
      label: '不是空讲道理',
      pass: abs < 3,
      hint: '「应该／必须／理论上」用了 ' + abs + ' 次，太多了。把道理藏进事情里。'
    });
    var pass = true;
    for(var i=0;i<checks.length;i++){ if(!checks[i].pass){ pass = false; break; } }
    return { pass: pass, checks: checks };
  }

  /* =========================================================
     渲染：首页
     ========================================================= */
  function renderHome(){
    $('groupName').textContent = db.group.name || '讲透社';
    var members = db.group.members || [];
    $('groupSub').textContent = '成员 ' + members.length + ' 人：' + members.join('、');

    // 未完成会话
    var pending = null;
    for(var i=0;i<db.sessions.length;i++){
      if(!db.sessions[i].done){ pending = db.sessions[i]; break; }
    }
    var pbox = $('pendingBox');
    if(pending){
      pbox.innerHTML =
        '<div class="pending"><p>有一次会话没做完：<strong>' + esc(pending.topic || '还没定主题') +
        '</strong>（' + esc(pending.date) + '）</p>' +
        '<button class="btn btn-sm" id="resumeBtn" type="button">接着做</button></div>';
      $('resumeBtn').addEventListener('click', function(){
        cur = pending; showView('session'); renderSession();
      });
    } else {
      pbox.innerHTML = '';
    }

    // 统计
    var done = db.sessions.filter(function(s){ return s.done; });
    $('statSessions').textContent = done.length;
    $('statCards').textContent = db.cards.length;

    // 连续天数
    var days = {};
    done.forEach(function(s){ days[s.date] = true; });
    var streak = 0;
    var d = new Date();
    while(true){
      var k = d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
      if(days[k]){ streak++; d.setDate(d.getDate()-1); }
      else if(streak === 0 && k === todayStr()){ d.setDate(d.getDate()-1); }
      else break;
      if(streak > 400) break;
    }
    $('statStreak').textContent = streak;

    // 平均自评
    var sum = 0, cnt = 0;
    done.forEach(function(s){
      if(s.review && s.review.clear){
        sum += (Number(s.review.clear) + Number(s.review.inspire || 0)) / 2;
        cnt++;
      }
    });
    $('statAvg').textContent = cnt ? (sum/cnt).toFixed(1) : '—';

    // 最近会话
    var list = $('recentList');
    if(!db.sessions.length){
      list.innerHTML = '<p class="rec-empty">还没有会话。点上面的按钮，带一个真实问题来试试。</p>';
    } else {
      var html = '';
      db.sessions.slice(0, 8).forEach(function(s){
        var meta = s.done ? ('已完成 · ' + esc(s.date)) : ('未完成 · ' + esc(s.date));
        html += '<button class="rec-item" type="button" data-sid="' + esc(s.id) + '">' +
                  '<span class="rec-title">' + esc(s.topic || '（未定主题）') + '</span>' +
                  '<span class="rec-meta">' + meta + '</span>' +
                '</button>';
      });
      list.innerHTML = html;
      Array.prototype.forEach.call(list.querySelectorAll('.rec-item'), function(btn){
        btn.addEventListener('click', function(){
          var sid = btn.getAttribute('data-sid');
          var target = null;
          for(var i=0;i<db.sessions.length;i++){ if(db.sessions[i].id === sid){ target = db.sessions[i]; break; } }
          if(target){ cur = target; showView('session'); renderSession(); }
        });
      });
    }
  }

  /* =========================================================
     渲染：会话
     ========================================================= */
  function pushMsg(who, text, label, extra){
    cur.log.push({ who: who, text: text, label: label || '', extra: extra || null, t: nowLabel() });
    saveDB();
  }

  function renderSteps(){
    var idx = stepIndexOf(cur);
    var html = '';
    STEPS.forEach(function(st, i){
      var cls = 'step-chip';
      if(i < idx) cls += ' is-done';
      else if(i === idx) cls += ' is-active';
      html += '<span class="' + cls + '"><i>' + (i+1) + '</i>' + st.label + '</span>';
    });
    $('steps').innerHTML = html;
  }

  function renderThread(){
    var t = $('thread');
    var html = '';
    cur.log.forEach(function(m){
      if(m.who === 'me'){
        html += '<div class="msg me"><div class="bubble">' + esc(m.text) + '</div></div>';
      } else if(m.who === 'probe'){
        html += '<div class="msg probe"><span class="depth">' + esc(m.label) + '</span>' +
                '<div class="bubble">' + esc(m.text) + '</div></div>';
      } else if(m.who === 'note'){
        html += '<div class="msg note"><div class="bubble">' + esc(m.text) + '</div></div>';
      } else if(m.who === 'warn'){
        html += '<div class="msg warn"><div class="bubble">' + esc(m.text) + '</div></div>';
      } else if(m.who === 'checks'){
        var lis = '';
        (m.extra || []).forEach(function(c){
          lis += '<li class="' + (c.pass ? 'ok' : 'no') + '">' +
                 '<span>' + esc(c.label) + (c.pass ? '' : '　' + esc(c.hint)) + '</span></li>';
        });
        html += '<div class="msg note"><div class="bubble">' +
                (m.text ? '<span class="tag-label">' + esc(m.text) + '</span>' : '') +
                '<ul class="check-list">' + lis + '</ul></div></div>';
      } else {
        html += '<div class="msg sys"><div class="bubble">' +
                (m.label ? '<span class="tag-label">' + esc(m.label) + '</span>' : '') +
                esc(m.text) + '</div></div>';
      }
    });

    // 表单类步骤
    if(cur.step === 'card') html += cardFormHTML();
    if(cur.step === 'review') html += reviewFormHTML();
    if(cur.step === 'done') html += doneHTML();

    t.innerHTML = html;
    bindInlineForms();
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  function cardFormHTML(){
    return '<div class="inline-form">' +
      '<h2>沉淀成一张话术卡</h2>' +
      '<p class="hint">三样东西：一句话核心、一个故事、一个让人想接话的钩子。以后写东西、跟人聊天都能直接用。</p>' +
      '<div class="field"><label for="cardCore">一句话核心（20 字以内）</label>' +
        '<input id="cardCore" type="text" maxlength="40" value="' + esc(cur.card.core || '') + '" placeholder="例：不是不会拒绝，是怕被讨厌">' +
        '<span class="hint">要能被记住、能被转述。别写「关于……的思考」。</span></div>' +
      '<div class="field"><label for="cardStory">故事</label>' +
        '<textarea id="cardStory" rows="6">' + esc(cur.card.story || cur.story || '') + '</textarea>' +
        '<span class="hint">可以再改一遍，把它磨得更短、更具体。</span></div>' +
      '<div class="field"><label for="cardHook">反问钩子</label>' +
        '<input id="cardHook" type="text" maxlength="60" value="' + esc(cur.card.hook || '') + '" placeholder="例：你上一次说「好的」的时候，心里真的同意吗？">' +
        '<span class="hint">让人听完想接一句、想反驳一句，或者想沉默三秒。</span></div>' +
      '<div class="btn-row"><button class="btn btn-primary" id="saveCardBtn" type="button">保存这张卡</button></div>' +
    '</div>';
  }

  function reviewFormHTML(){
    return '<div class="inline-form">' +
      '<h2>最后，给自己评一下</h2>' +
      '<p class="hint">不是打分，是留个坐标。以后回头看，能看见自己怎么变的。</p>' +
      '<div class="field"><label for="rvClear">我讲清楚了吗？</label>' +
        '<div class="range-row"><input id="rvClear" type="range" min="1" max="5" value="' + (cur.review.clear || 3) + '">' +
        '<span class="range-val" id="rvClearVal">' + (cur.review.clear || 3) + '</span></div></div>' +
      '<div class="field"><label for="rvInspire">对别人有启发吗？</label>' +
        '<div class="range-row"><input id="rvInspire" type="range" min="1" max="5" value="' + (cur.review.inspire || 3) + '">' +
        '<span class="range-val" id="rvInspireVal">' + (cur.review.inspire || 3) + '</span></div></div>' +
      '<div class="field"><label for="rvComment">给自己留一句话</label>' +
        '<textarea id="rvComment" rows="2" placeholder="例：第三层卡住了，说明我一直没想清楚自己到底在怕什么">' + esc(cur.review.comment || '') + '</textarea></div>' +
      '<div class="btn-row"><button class="btn btn-primary" id="finishBtn" type="button">结束这次会话</button></div>' +
    '</div>';
  }

  function doneHTML(){
    return '<div class="inline-form">' +
      '<h2>这次做完了</h2>' +
      '<p class="hint">问题留在这儿，卡进了话术卡库。下次带新的来。</p>' +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" id="doneHomeBtn" type="button">回到小组</button>' +
        '<button class="btn btn-ghost" id="doneMdBtn" type="button">导出这次记录（Markdown）</button>' +
      '</div>' +
    '</div>';
  }

  function bindInlineForms(){
    var saveCard = $('saveCardBtn');
    if(saveCard){
      saveCard.addEventListener('click', function(){
        var core = $('cardCore').value.trim();
        var story = $('cardStory').value.trim();
        var hook = $('cardHook').value.trim();
        if(!core){ $('cardCore').focus(); return; }
        cur.card = { core: core, story: story, hook: hook };
        cur.story = story;
        db.cards.unshift({
          id: uid(), sessionId: cur.id, date: cur.date,
          topic: cur.topic, core: core, story: story, hook: hook
        });
        cur.step = 'review';
        saveDB();
        renderSession();
      });
    }
    var rvClear = $('rvClear'), rvInspire = $('rvInspire');
    if(rvClear){
      rvClear.addEventListener('input', function(){ $('rvClearVal').textContent = rvClear.value; });
    }
    if(rvInspire){
      rvInspire.addEventListener('input', function(){ $('rvInspireVal').textContent = rvInspire.value; });
    }
    var finish = $('finishBtn');
    if(finish){
      finish.addEventListener('click', function(){
        cur.review = {
          clear: Number($('rvClear').value),
          inspire: Number($('rvInspire').value),
          comment: $('rvComment').value.trim()
        };
        cur.step = 'done';
        cur.done = true;
        cur.updatedAt = Date.now();
        saveDB();
        renderSession();
        renderHome();
      });
    }
    var homeBtn = $('doneHomeBtn');
    if(homeBtn){
      homeBtn.addEventListener('click', function(){ showView('home'); renderHome(); });
    }
    var mdBtn = $('doneMdBtn');
    if(mdBtn){
      mdBtn.addEventListener('click', function(){
        download('学习会话_' + cur.date.replace(/-/g,'') + '.md', sessionMD(cur), 'text/markdown');
      });
    }
  }

  function renderSession(){
    renderSteps();
    renderThread();
    var composer = $('composer');
    var ta = $('answerInput');
    var step = cur.step;

    if(step === 'card' || step === 'review' || step === 'done'){
      composer.hidden = true;
      return;
    }
    composer.hidden = false;

    var ph = '';
    if(step === 'topic') ph = '比如：《认知觉醒》第三章 / 沉没成本 / 上周和客户的那次争执';
    else if(step === 'question') ph = '比如：为什么我明知道该拒绝，最后还是答应了？';
    else if(step === 'explain') ph = '用三句话，讲给一个完全不懂这行的人听';
    else if(step === 'probe') ph = '写具体一点，越具体越好';
    else if(step === 'story') ph = '150 字以上。要有人、有事、有转折。';
    ta.placeholder = ph;
    ta.value = cur.draft || '';
    ta.focus();
  }

  /* =========================================================
     会话流程
     ========================================================= */
  function startSession(){
    var s = {
      id: uid(),
      date: todayStr(),
      topic: '',
      question: '',
      presenter: (db.group.members && db.group.members[0]) || '我',
      step: 'topic',
      probeIndex: 0,
      explain: '',
      explainTry: 0,
      questionTry: 0,
      probes: [],
      story: '',
      storyTry: 0,
      card: { core: '', story: '', hook: '' },
      review: { clear: 0, inspire: 0, comment: '' },
      log: [],
      done: false,
      updatedAt: Date.now()
    };
    db.sessions.unshift(s);
    saveDB();
    cur = s;

    pushMsg('sys', '我们开始。\n\n这次想弄明白什么？先写下主题——一本书的某一章、一个概念、或者一件具体的事都可以。', '第一步 · 带问题来');
    showView('session');
    renderSession();
  }

  function submit(){
    var ta = $('answerInput');
    var v = ta.value.trim();
    if(!v) return;

    var s = cur;
    s.draft = '';

    if(s.step === 'topic'){
      if(v.length < 2) return;
      s.topic = v;
      pushMsg('me', v);
      pushMsg('sys', '好。那你带来的真实问题是什么？\n\n注意：要是一个问句，不是一个话题。\n「沉没成本」是话题，「为什么我明知道这单亏钱还是不肯停」才是问题。', '还是第一步');
      s.step = 'question';
      saveDB(); renderSession(); return;
    }

    if(s.step === 'question'){
      var isQ = /[？?]/.test(v) || /(吗|为什么|怎么|如何|是不是|到底|该不该|能不能|要不要|哪一|有没有)/.test(v);
      if(!isQ && s.questionTry === 0){
        s.questionTry = 1;
        pushMsg('me', v);
        pushMsg('warn', '这还是一个话题，不是一个问题。\n\n试着在前面加三个字：「为什么」「到底」「该怎么」。', '再改一下');
        saveDB(); renderSession(); return;
      }
      s.question = v;
      pushMsg('me', v);
      pushMsg('sys', '问题记下了。\n\n现在进入第二关：你是主讲人。\n\n假设组员完全不懂这个领域，用三句话把这个问题的来龙去脉讲清楚。讲不清的地方，就是你还没想清的地方。', '第二步 · 讲清它');
      s.step = 'explain';
      saveDB(); renderSession(); return;
    }

    if(s.step === 'explain'){
      pushMsg('me', v);
      var issues = checkExplain(v);
      if(issues.length && s.explainTry === 0){
        s.explainTry = 1;
        var txt = '先别急着往下走。' + issues.map(function(x){ return '\n· ' + x; }).join('');
        pushMsg('warn', txt, '还差一点');
        s.draft = v;
        saveDB(); renderSession(); return;
      }
      s.explain = v;
      pushMsg('note', '好。下面我开始追问了。\n\n接下来五层，我不会告诉你答案，也不会评价你说得对不对。我只负责往下问。答不上来是正常的——答不上来的那个地方，才是真问题。', '第三步 · 五层追问');
      s.step = 'probe';
      s.probeIndex = 0;
      askProbe();
      saveDB(); renderSession(); return;
    }

    if(s.step === 'probe'){
      var p = PROBES[s.probeIndex];
      var rec = s.probes[s.probeIndex];
      if(!rec){
        rec = { key: p.key, q: p.ask, a: '', flag: '' };
        s.probes[s.probeIndex] = rec;
      }
      if(rec.flag === 'retry'){
        rec.a = rec.a + '\n' + v;
        rec.flag = 'done';
        pushMsg('me', v);
        pushMsg('note', '记下了。', '第 ' + (s.probeIndex+1) + ' 层 · ' + p.key);
        nextProbe();
      } else {
        rec.a = v;
        if(p.ok(v)){
          rec.flag = 'done';
          pushMsg('me', v);
          pushMsg('note', '好。', '第 ' + (s.probeIndex+1) + ' 层 · ' + p.key);
          nextProbe();
        } else {
          rec.flag = 'retry';
          pushMsg('me', v);
          pushMsg('warn', p.retry, '再想一层');
        }
      }
      saveDB(); renderSession(); return;
    }

    if(s.step === 'story'){
      pushMsg('me', v);
      var r = checkStory(v);
      if(!r.pass && s.storyTry === 0){
        s.storyTry = 1;
        pushMsg('checks', '这个故事还差几样东西：', null, r.checks);
        s.draft = v;
        saveDB(); renderSession(); return;
      }
      if(!r.pass){
        pushMsg('checks', '还是差一点，但我先记下来。', null, r.checks);
      } else {
        pushMsg('checks', '这个故事立住了：', null, r.checks);
      }
      s.story = v;
      pushMsg('note', '好。这就是你的东西了——不是从书里抄的，是你自己长出来的。\n\n最后一步，把它压成一张卡。', '第五步 · 沉淀');
      s.step = 'card';
      saveDB(); renderSession(); return;
    }
  }

  function askProbe(){
    var p = PROBES[cur.probeIndex];
    pushMsg('probe', p.ask, String(cur.probeIndex + 1));
    saveDB();
  }

  function nextProbe(){
    cur.probeIndex++;
    if(cur.probeIndex >= PROBES.length){
      cur.step = 'story';
      pushMsg('note',
        '五层问完了。\n\n现在有一件事要提醒你：刚才那些回答，只是你自己觉得想明白了。\n\n真正的检验在这里——把它讲成一个故事。要有人、有事、有转折。听的人不懂这行，也能听懂。\n\n讲不出来，说明还没想透；讲得出来但没意思，说明还差一个具体的场景。',
        '第四步 · 讲成故事');
      return;
    }
    askProbe();
  }

  /* =========================================================
     渲染：话术卡
     ========================================================= */
  function renderCards(){
    var g = $('cardGrid');
    if(!db.cards.length){
      g.innerHTML = '<p class="empty-state">还没有话术卡。<br>做完一次会话，把想明白的东西压成一张卡，它会出现在这里。</p>';
      return;
    }
    var html = '';
    db.cards.forEach(function(c){
      html += '<article class="tcard">' +
        '<p class="tcard-core">' + esc(c.core) + '</p>' +
        (c.story ? '<p class="tcard-story">' + esc(c.story) + '</p>' : '') +
        (c.hook ? '<p class="tcard-hook">' + esc(c.hook) + '</p>' : '') +
        '<div class="tcard-foot"><span>' + esc(c.date) + ' · ' + esc(c.topic || '') + '</span>' +
        '<button class="btn btn-ghost btn-sm" type="button" data-cid="' + esc(c.id) + '">复制</button></div>' +
      '</article>';
    });
    g.innerHTML = html;
    Array.prototype.forEach.call(g.querySelectorAll('[data-cid]'), function(btn){
      btn.addEventListener('click', function(){
        var cid = btn.getAttribute('data-cid');
        var card = null;
        for(var i=0;i<db.cards.length;i++){ if(db.cards[i].id === cid){ card = db.cards[i]; break; } }
        if(!card) return;
        var text = card.core + '\n\n' + (card.story || '') + '\n\n' + (card.hook || '');
        try{
          if(navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText(text).then(function(){
              btn.textContent = '已复制';
              setTimeout(function(){ btn.textContent = '复制'; }, 1600);
            }, function(){ btn.textContent = '复制失败'; });
          } else {
            btn.textContent = '不支持';
          }
        }catch(e){ btn.textContent = '复制失败'; }
      });
    });
  }

  /* =========================================================
     渲染：记录
     ========================================================= */
  function sessionMD(s){
    var L = [];
    L.push('## ' + s.date + ' 学习会话');
    L.push('');
    L.push('- 主讲人：' + (s.presenter || '我'));
    L.push('- 主题：' + (s.topic || ''));
    L.push('- 问题：' + (s.question || ''));
    L.push('');
    L.push('### 主讲');
    L.push(s.explain || '');
    L.push('');
    L.push('### 五层追问');
    (s.probes || []).forEach(function(p, i){
      L.push('');
      L.push('**第 ' + (i+1) + ' 层 · ' + p.key + '**');
      L.push('> ' + p.q);
      L.push('');
      L.push(p.a || '');
    });
    L.push('');
    L.push('### 故事');
    L.push(s.story || '');
    L.push('');
    if(s.card && s.card.core){
      L.push('### 话术卡');
      L.push('- **一句话核心**：' + s.card.core);
      L.push('- **故事**：' + (s.card.story || ''));
      L.push('- **反问钩子**：' + (s.card.hook || ''));
      L.push('');
    }
    if(s.review && s.review.clear){
      L.push('### 自评');
      L.push('- 讲清楚了：' + s.review.clear + '/5');
      L.push('- 有启发：' + s.review.inspire + '/5');
      if(s.review.comment) L.push('- 留给自己：' + s.review.comment);
      L.push('');
    }
    return L.join('\n');
  }

  function renderRecords(){
    var box = $('recordList');
    var done = db.sessions.filter(function(s){ return s.done || s.card.core; });
    if(!done.length){
      box.innerHTML = '<p class="empty-state">还没有完成的会话记录。</p>';
      return;
    }
    var html = '';
    done.forEach(function(s){
      var body = '';
      body += '<div><h4>主讲</h4><div class="ans">' + esc(s.explain || '') + '</div></div>';
      (s.probes || []).forEach(function(p, i){
        body += '<div><h4>第 ' + (i+1) + ' 层 · ' + esc(p.key) + '</h4>' +
                '<blockquote>' + esc(p.q) + '</blockquote>' +
                '<div class="ans">' + esc(p.a || '') + '</div></div>';
      });
      if(s.story) body += '<div><h4>故事</h4><div class="ans">' + esc(s.story) + '</div></div>';
      if(s.card && s.card.core){
        body += '<div><h4>话术卡</h4><div class="ans">' +
                esc(s.card.core) + '\n\n' + esc(s.card.story || '') + '\n\n' + esc(s.card.hook || '') +
                '</div></div>';
      }
      if(s.review && s.review.clear){
        body += '<div><h4>自评</h4><div class="ans">讲清楚了 ' + esc(s.review.clear) + '/5 · 有启发 ' +
                esc(s.review.inspire) + '/5' + (s.review.comment ? '\n' + esc(s.review.comment) : '') + '</div></div>';
      }
      html += '<article class="record">' +
        '<div class="record-head"><h3>' + esc(s.topic || '（未定主题）') + '</h3>' +
        '<time>' + esc(s.date) + ' · ' + esc(s.presenter || '我') + '</time></div>' +
        (s.question ? '<p class="record-q">' + esc(s.question) + '</p>' : '') +
        '<details><summary>展开完整过程</summary><div class="detail-body">' + body + '</div></details>' +
      '</article>';
    });
    box.innerHTML = html;
  }

  /* =========================================================
     视图切换
     ========================================================= */
  function showView(name){
    curView = name;
    ['home','session','cards','records'].forEach(function(v){
      $('view-' + v).hidden = (v !== name);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
      t.classList.toggle('is-active', t.getAttribute('data-view') === name);
    });
    if(name === 'home') renderHome();
    if(name === 'cards') renderCards();
    if(name === 'records') renderRecords();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  /* =========================================================
     事件绑定
     ========================================================= */
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
    t.addEventListener('click', function(){ showView(t.getAttribute('data-view')); });
  });

  $('startBtn').addEventListener('click', startSession);
  $('backBtn').addEventListener('click', function(){ showView('home'); });

  $('submitBtn').addEventListener('click', submit);
  $('answerInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      submit();
    }
  });

  // 小组编辑
  var dlg = $('groupDialog');
  $('editGroupBtn').addEventListener('click', function(){
    $('gNameInput').value = db.group.name || '讲透社';
    $('gMembersInput').value = (db.group.members || []).join('、');
    if(typeof dlg.showModal === 'function') dlg.showModal();
    else dlg.setAttribute('open','');
  });
  $('groupCancel').addEventListener('click', function(){
    try{ dlg.close(); }catch(e){ dlg.removeAttribute('open'); }
  });
  $('groupSave').addEventListener('click', function(){
    var nm = $('gNameInput').value.trim() || '讲透社';
    var ms = $('gMembersInput').value.split(/[、,，\s]+/).filter(function(x){ return x.trim(); });
    if(!ms.length) ms = ['我'];
    db.group.name = nm;
    db.group.members = ms;
    saveDB();
    try{ dlg.close(); }catch(e){ dlg.removeAttribute('open'); }
    renderHome();
  });

  // 数据管理
  $('exportAllBtn').addEventListener('click', function(){
    download('讲透社_备份_' + todayStr().replace(/-/g,'') + '.json', JSON.stringify(db, null, 2), 'application/json');
  });
  $('importAllBtn').addEventListener('click', function(){ $('importFile').click(); });
  $('importFile').addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var d = JSON.parse(String(reader.result));
        if(!d || !Array.isArray(d.sessions)) throw new Error('格式不对');
        if(!d.group) d.group = defaultDB().group;
        if(!Array.isArray(d.cards)) d.cards = [];
        db = d;
        saveDB();
        showView('home');
      }catch(err){
        alert('导入失败：这个文件不是有效的备份。');
      }
      e.target.value = '';
    };
    reader.readAsText(f);
  });
  $('clearAllBtn').addEventListener('click', function(){
    if(!confirm('确定要清空所有数据吗？\n\n所有会话记录和话术卡都会被删除，且无法恢复。建议先导出备份。')) return;
    if(!confirm('再确认一次：真的要全部删掉？')) return;
    try{ localStorage.removeItem(STORE_KEY); }catch(e){}
    db = defaultDB();
    cur = null;
    saveDB();
    showView('home');
  });

  $('exportRecordsBtn').addEventListener('click', function(){
    var done = db.sessions.filter(function(s){ return s.done || s.card.core; });
    if(!done.length){ alert('还没有可导出的记录。'); return; }
    var parts = ['# ' + (db.group.name || '讲透社') + ' · 学习会话记录', ''];
    done.slice().reverse().forEach(function(s){
      parts.push(sessionMD(s));
      parts.push('---');
      parts.push('');
    });
    download('学习记录_' + todayStr().replace(/-/g,'') + '.md', parts.join('\n'), 'text/markdown');
  });

  /* =========================================================
     初始化
     ========================================================= */
  renderHome();
  showView('home');

  }catch(err){
    // 脚本失败时保留静态可读内容
    if(window.console && console.error) console.error(err);
  }
})();
</script>
